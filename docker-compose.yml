
services:
  redis:
    image: redis:7-alpine
    container_name: fila-pedidos
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api-pedidos
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_PATH: /data/pedidos.db
    volumes:
      - dados_pedidos:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: worker-pedidos
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_PATH: /data/pedidos.db
    volumes:
      - dados_pedidos:/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  dados_pedidos: